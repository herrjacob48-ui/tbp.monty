# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: robodk_surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025_ltp
  - /monty/sensor_module: camera_surf_rgba_ltp
  - /monty/connectivity: 1lm_1sm
  - /environment: robodk_fanuc
  - /env_interface: robodk_objects
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: basic_info_monty_runs
  - _self_

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment

  config:
    show_sensor_output: false
    do_train: true
    do_eval: false
    max_train_steps: 20
    max_eval_steps: 0
    max_total_steps: 20
    n_train_epochs: 1
    model_name_or_path: ""
    n_eval_epochs: 0
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: INFO
    logging:
      run_name: robodk_cube_demo
    monty_config:
      monty_args:
        num_exploratory_steps: 12
        min_train_steps: 1
        max_total_steps: 20
    environment:
      env_init_args:
        max_step_mm: 2.0
        observation_output_dir: ${experiment.config.logging.output_dir}/camera_observations
