# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025_ltp
  - /monty/sensor_module: camera_surf_rgba_ltp
  - /monty/connectivity: 1lm_1sm
  - /environment: robodk_fanuc
  - /env_interface: robodk_objects
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: basic_info_monty_runs
  - _self_

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment

  config:
    show_sensor_output: false
    do_train: true
    do_eval: true
    max_train_steps: 100
    max_eval_steps: 100
    max_total_steps: 500
    n_train_epochs: 3
    model_name_or_path: ""
    n_eval_epochs: 1
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: robodk_fanuc_train_eval_ltp
