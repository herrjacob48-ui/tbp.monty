# @package _global_

defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025_ltp
  - /monty/sensor_module: camera_surf_rgba_ltp
  - /monty/connectivity: 1lm_1sm
  - /environment: robodk_fanuc
  # The adapter toggles the station cube's visibility; it does not reposition it.
  - /env_interface: robodk_objects
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: basic_info_monty_runs
  - _self_

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment

  config:
    show_sensor_output: false
    do_train: true
    do_eval: true
    max_train_steps: 100
    max_eval_steps: 100
    max_total_steps: 500
    n_train_epochs: 3
    model_name_or_path: ""
    n_eval_epochs: 1
    min_lms_match: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: INFO
    logging:
      run_name: robodk_cube_train_eval
    monty_config:
      monty_args:
        num_exploratory_steps: 1000
        min_train_steps: 3
        max_total_steps: 2500
    environment:
      env_init_args:
        # Simulation-only convenience; the adapter rejects this in physical-robot mode.
        check_motion_safety: false
        max_step_mm: 10.0
